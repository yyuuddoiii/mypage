<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>حساب الفلوس</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow-x: hidden; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    color: #fff;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: env(safe-area-inset-top, 14px) 14px env(safe-area-inset-bottom, 10px);
    overflow-y: auto;
    gap: 10px;
  }
  .title {
    font-size: 13px;
    color: #94a3b8;
    margin: 0;
  }
  .balance {
    font-size: 40px;
    font-weight: 800;
    margin: 0;
    letter-spacing: -1px;
    transition: transform 0.15s ease;
  }
  .balance.bump { transform: scale(1.06); }
  .balance.pos { color: #34d399; }
  .balance.neg { color: #f87171; }

  .quick-row {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 420px;
  }
  .quick-btn {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 16px 0;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .quick-btn.add { background: #059669; }
  .quick-btn.sub { background: #dc2626; }
  .quick-btn:active { filter: brightness(0.9); transform: translateY(1px); }

  .custom-box {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 12px;
  }
  .custom-box label {
    font-size: 12px;
    color: #94a3b8;
    display: block;
    margin-bottom: 6px;
  }
  .custom-input-row {
    display: flex;
    gap: 8px;
  }
  input[type=number] {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 10px;
    font-size: 17px;
    text-align: center;
    background: #0f172a;
    color: #fff;
    outline: none;
    min-width: 0;
  }
  .custom-btn {
    border: none;
    border-radius: 10px;
    padding: 0 16px;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    flex-shrink: 0;
  }
  .custom-btn.add { background: #059669; }
  .custom-btn.sub { background: #dc2626; }
  .custom-btn:active { filter: brightness(0.9); }

  .history {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.04);
    border-radius: 16px;
    padding: 10px 14px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .history h3 {
    font-size: 13px;
    color: #94a3b8;
    margin: 2px 0 8px;
  }
  .entry {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 14px;
  }
  .entry:last-child { border-bottom: none; }
  .entry .amt.pos { color: #34d399; font-weight: 700; }
  .entry .amt.neg { color: #f87171; font-weight: 700; }
  .entry .time { color: #64748b; font-size: 11px; }
  .empty { color: #64748b; font-size: 13px; text-align: center; padding: 10px 0; }

  .reset-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.2);
    color: #94a3b8;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="title">رصيدي الحالي</div>
<div class="balance" id="balance">$0</div>

<div class="quick-row">
  <button class="quick-btn add" onclick="addAmount(100)">+ 100$</button>
  <button class="quick-btn sub" onclick="addAmount(-100)">- 100$</button>
</div>

<div class="custom-box">
  <label>مبلغ مخصص</label>
  <div class="custom-input-row">
    <button class="custom-btn sub" onclick="applyCustom(-1)">−</button>
    <input type="number" id="customAmount" placeholder="اكتب المبلغ" inputmode="decimal">
    <button class="custom-btn add" onclick="applyCustom(1)">+</button>
  </div>
</div>

<div class="history">
  <h3>آخر العمليات</h3>
  <div id="entries"><div class="empty">ما فيه عمليات بعد</div></div>
</div>

<button class="reset-btn" onclick="resetAll()">تصفير الكل</button>

<script>
let balance = 0;
let history = [];
const STORAGE_KEY = 'money-tracker-state';

function render() {
  const balEl = document.getElementById('balance');
  balEl.textContent = (balance >= 0 ? '$' : '-$') + Math.abs(balance).toLocaleString();
  balEl.className = 'balance ' + (balance > 0 ? 'pos' : balance < 0 ? 'neg' : '');

  const entriesEl = document.getElementById('entries');
  if (history.length === 0) {
    entriesEl.innerHTML = '<div class="empty">ما فيه عمليات بعد</div>';
  } else {
    entriesEl.innerHTML = history.slice().reverse().map(e => {
      const sign = e.amount >= 0 ? '+' : '-';
      const cls = e.amount >= 0 ? 'pos' : 'neg';
      return `<div class="entry">
        <span class="time">${e.time}</span>
        <span class="amt ${cls}">${sign}$${Math.abs(e.amount).toLocaleString()}</span>
      </div>`;
    }).join('');
  }
}

function bump() {
  const balEl = document.getElementById('balance');
  balEl.classList.add('bump');
  setTimeout(() => balEl.classList.remove('bump'), 150);
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ balance, history }));
  } catch (e) { console.error('save failed', e); }
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      balance = data.balance || 0;
      history = data.history || [];
    }
  } catch (e) {
    // no saved data yet
  }
  render();
}

function timeStamp() {
  const now = new Date();
  return now.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' }) + ' ' +
         now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
}

function addAmount(amount) {
  balance += amount;
  history.push({ amount, time: timeStamp() });
  render();
  bump();
  save();
}

function applyCustom(sign) {
  const input = document.getElementById('customAmount');
  const val = parseFloat(input.value);
  if (!val || val <= 0) return;
  addAmount(val * sign);
  input.value = '';
}

function resetAll() {
  if (!confirm('متأكد تبي تصفر كل شي؟')) return;
  balance = 0;
  history = [];
  render();
  save();
}

load();
</script>

</body>
</html>
